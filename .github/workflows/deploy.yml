name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write config.js from secrets
        run: |
          cat > public/config.js <<EOF
          // Auto-generated by GitHub Actions — do not edit
          const GOOGLE_API_KEY = "${{ secrets.GOOGLE_API_KEY }}";
          const GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}";
          EOF

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-firebase-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HIPMAPS_2026 }}
          projectId: hipmaps-2026
          channelId: live
